[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navpromini-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) Server for NavPro Mini AMR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Botforge Robotics" }
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0.0",
    "navpromini>=1.0.0",
]

[project.scripts]
navpromini-mcp = "navpromini_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["navpromini_mcp*"]
