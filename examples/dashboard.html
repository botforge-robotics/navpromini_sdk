<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NavProMini Dashboard</title>
<style>
  :root {
    --bg: #0f1420; --card: #182033; --line: #26304a;
    --fg: #e8ecf4; --dim: #8b96ad;
    --ok: #4caf50; --warn: #ffa726; --err: #ef5350; --accent: #5c6bc0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 Inter, system-ui, sans-serif;
  }
  header { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.25rem; }
  input {
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
    padding: 0.45rem 0.7rem; border-radius: 0.35rem; font: inherit; min-width: 15rem;
  }
  button {
    background: var(--accent); border: 0; color: #fff; font: inherit; font-weight: 600;
    padding: 0.45rem 0.9rem; border-radius: 0.35rem; cursor: pointer;
  }
  button:hover { filter: brightness(1.12); }
  button.ghost { background: var(--card); border: 1px solid var(--line); }
  #status { margin-left: auto; color: var(--dim); font-size: 0.9rem; }
  #status.live { color: var(--ok); }
  #status.down { color: var(--err); }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 0.5rem; padding: 1rem; }
  .card h2 { margin: 0 0 0.6rem; font-size: 0.75rem; text-transform: uppercase;
             letter-spacing: 0.08em; color: var(--dim); font-weight: 700; }
  .big { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .sub { color: var(--dim); font-size: 0.88rem; }
  .row { display: flex; justify-content: space-between; padding: 0.18rem 0; }
  .row span:last-child { font-family: ui-monospace, "JetBrains Mono", monospace; }
  .pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 1rem;
          font-size: 0.75rem; font-weight: 700; }
  .pill.ok { background: var(--ok); } .pill.warn { background: var(--warn); color: #241a00; }
  .pill.err { background: var(--err); }
  canvas { width: 100%; height: auto; background: #0b0f19; border-radius: 0.35rem; }
  .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.8rem; }
</style>
</head>
<body>

<header>
  <h1>NavProMini</h1>
  <input id="host" value="192.168.1.50" spellcheck="false" aria-label="Robot host">
  <button id="connect">Connect</button>
  <span id="status">idle</span>
</header>

<div class="grid">
  <div class="card">
    <h2>Battery</h2>
    <div class="big" id="batt">—</div>
    <div class="sub" id="battSub">no data</div>
  </div>

  <div class="card">
    <h2>Pose</h2>
    <div class="row"><span>x</span><span id="px">—</span></div>
    <div class="row"><span>y</span><span id="py">—</span></div>
    <div class="row"><span>heading</span><span id="pt">—</span></div>
    <div class="row"><span>frame</span><span id="pf">—</span></div>
  </div>

  <div class="card">
    <h2>Dock</h2>
    <div class="big" id="dock">—</div>
    <div class="sub" id="dockSub">&nbsp;</div>
  </div>

  <div class="card">
    <h2>Robot</h2>
    <div class="row"><span>name</span><span id="rname">—</span></div>
    <div class="row"><span>mode</span><span id="rmode">—</span></div>
    <div class="row"><span>map</span><span id="rmap">—</span></div>
    <div class="row"><span>CPU</span><span id="rcpu">—</span></div>
  </div>

  <div class="card" style="grid-column: 1 / -1;">
    <h2>Laser scan</h2>
    <canvas id="scan" width="640" height="320"></canvas>
    <div class="controls">
      <button class="ghost" id="stop">Stop</button>
      <button class="ghost" id="dockBtn">Dock</button>
      <button class="ghost" id="cancel">Cancel goal</button>
    </div>
  </div>
</div>

<script>
// Single-file dashboard: REST for the things that change slowly, the event
// stream for everything that does not. Open it from anywhere — the robot's
// CORS policy is open, so no server is needed to host this.
let ws = null, base = "", timer = null;

const $ = (id) => document.getElementById(id);
const fmt = (n, d = 3) => (n === null || n === undefined ? "—" : n.toFixed(d));

function setStatus(text, cls) {
  $("status").textContent = text;
  $("status").className = cls || "";
}

async function api(method, path, body) {
  const res = await fetch(base + path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = res.status === 204 ? {} : await res.json();
  if (!res.ok) throw Object.assign(new Error(json?.error?.message ?? res.statusText),
                                   { code: json?.error?.code });
  return json;
}

function connect() {
  const host = $("host").value.trim();
  if (!host) return;
  base = `http://${host}:8090/api/v1`;

  if (ws) { ws.onclose = null; ws.close(); }
  if (timer) clearInterval(timer);

  setStatus("connecting…");
  refreshSlow();
  timer = setInterval(refreshSlow, 5000);

  ws = new WebSocket(`ws://${host}:8090/api/v1/events`);

  ws.onopen = () => {
    setStatus("live", "live");
    ws.send(JSON.stringify({
      action: "subscribe",
      streams: ["pose", "pose_odom", "battery", "dock_status", "scan", "cpu_temperature"],
    }));
  };

  ws.onmessage = (ev) => {
    const { stream, data } = JSON.parse(ev.data);
    if (stream === "pose" || stream === "pose_odom") renderPose(data);
    else if (stream === "battery") renderBattery(data);
    else if (stream === "dock_status") renderDock(data);
    else if (stream === "scan") renderScan(data);
    else if (stream === "cpu_temperature") $("rcpu").textContent = `${data} °C`;
    else if (stream === "error") console.error(data.code, data.message);
  };

  // Subscriptions live in the connection, so a reconnect must re-subscribe.
  // connect() does that from scratch, which is why it is the retry.
  ws.onclose = () => { setStatus("disconnected — retrying", "down");
                       setTimeout(connect, 3000); };
  ws.onerror = () => setStatus("connection failed", "down");
}

async function refreshSlow() {
  try {
    const [info, mode] = await Promise.all([api("GET", "/system/info"),
                                            api("GET", "/mode")]);
    $("rname").textContent = info.robot.name;
    $("rmode").textContent = mode.mode;
    $("rmap").textContent = mode.map ?? "—";
  } catch (e) {
    setStatus(`unreachable: ${e.message}`, "down");
  }
}

function renderBattery(b) {
  $("batt").textContent = `${b.percentage?.toFixed(0) ?? "—"}%`;
  const cls = b.charging ? "ok" : b.percentage < 20 ? "err" : "warn";
  $("battSub").innerHTML =
    `<span class="pill ${cls}">${b.status}</span> ` +
    `${fmt(b.voltage, 2)} V · ${fmt(b.current, 2)} A` +
    (b.temperature != null ? ` · ${fmt(b.temperature, 1)} °C` : "");
}

function renderPose(p) {
  $("px").textContent = fmt(p.x);
  $("py").textContent = fmt(p.y);
  $("pt").textContent = `${(p.theta * 180 / Math.PI).toFixed(1)}°`;
  // The frame is the point: an odom pose is not comparable to map coordinates,
  // so it is labelled rather than quietly displayed as if it were one.
  $("pf").innerHTML = `<span class="pill ${p.frame === "map" ? "ok" : "warn"}">${p.frame}</span>`;
}

function renderDock(d) {
  const charging = typeof d === "object" ? d.charging : null;
  const state = typeof d === "object" ? (d.state ?? "unknown") : d;
  $("dock").textContent = state;
  $("dockSub").innerHTML = charging === null ? "&nbsp;"
    : `<span class="pill ${charging ? "ok" : "warn"}">${charging ? "charging" : "not charging"}</span>`;
}

function renderScan(s) {
  const c = $("scan"), ctx = c.getContext("2d");
  const cx = c.width / 2, cy = c.height / 2;
  const scale = Math.min(cx, cy) / Math.min(s.range_max, 6);

  ctx.fillStyle = "#0b0f19";
  ctx.fillRect(0, 0, c.width, c.height);

  ctx.strokeStyle = "#26304a";
  for (let r = 1; r <= 6; r++) {
    ctx.beginPath(); ctx.arc(cx, cy, r * scale, 0, 2 * Math.PI); ctx.stroke();
  }

  ctx.fillStyle = "#64b5f6";
  s.ranges.forEach((range, i) => {
    if (range === null) return;                 // null is "no return", not zero
    const a = s.angle_min + i * s.angle_increment;
    ctx.fillRect(cx + Math.cos(a) * range * scale,
                 cy - Math.sin(a) * range * scale, 2, 2);
  });

  ctx.fillStyle = "#ffa726";                    // the robot, facing +x
  ctx.beginPath();
  ctx.moveTo(cx + 7, cy); ctx.lineTo(cx - 5, cy - 5); ctx.lineTo(cx - 5, cy + 5);
  ctx.closePath(); ctx.fill();
}

$("connect").onclick = connect;
$("host").onkeydown = (e) => { if (e.key === "Enter") connect(); };
$("stop").onclick = () => api("POST", "/motion/stop").catch(alertErr);
$("dockBtn").onclick = () => api("POST", "/dock").catch(alertErr);
$("cancel").onclick = () => api("DELETE", "/navigation/goal").catch(alertErr);

function alertErr(e) { setStatus(`${e.code ?? "error"}: ${e.message}`, "down"); }
</script>
</body>
</html>
